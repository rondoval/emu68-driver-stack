name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        backend: ["off", "serial"]
        flavor: ["lvo", "rangeops"]
        include:
          - flavor: lvo
            force_lvo: "ON"
          - flavor: rangeops
            force_lvo: "OFF"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ${{ matrix.flavor }} / ${{ matrix.backend }} (in toolchain container)
        run: ./scripts/docker-build.sh
        env:
          EMU68_BUILD_DIR: build-${{ matrix.flavor }}-${{ matrix.backend }}
          EMU68_INSTALL_DIR: install-${{ matrix.flavor }}-${{ matrix.backend }}
          EMU68_CONFIGURE_ARGS: "-DEMU68_DEBUG_BACKEND=${{ matrix.backend }} -DEMU68_FORCE_LVO_CACHE_OPS=${{ matrix.force_lvo }}"

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v7
        with:
          name: emu68-drivers-${{ matrix.flavor }}-${{ matrix.backend }}
          path: |
            install-${{ matrix.flavor }}-${{ matrix.backend }}/LIBS
            install-${{ matrix.flavor }}-${{ matrix.backend }}/DEVS
            install-${{ matrix.flavor }}-${{ matrix.backend }}/C
            install-${{ matrix.flavor }}-${{ matrix.backend }}/Storage
          if-no-files-found: error
